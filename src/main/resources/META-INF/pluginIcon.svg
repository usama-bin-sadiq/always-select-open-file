  <!-- Tree structure -->
  <g stroke="#CED0D6" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
    <!-- Folder 1 -->
    <path d="M8 11.5h7"/>
    <!-- Folder 2 (open) -->
    <path d="M8 16h7"/>
    <path d="M9.5 16v3.5"/>
    <path d="M8 20h5.5"/>
