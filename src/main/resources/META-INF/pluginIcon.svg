<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Window frame -->
  <rect x="4" y="4" width="32" height="32" rx="5" fill="#2B2D30" stroke="#CED0D6" stroke-width="1.4"/>

  <!-- Sidebar -->
