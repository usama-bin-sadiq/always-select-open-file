  <!-- Selected file -->
  <rect x="7" y="23.5" width="9" height="5.5" rx="1.2" fill="#548AF7"/>
  <path d="M9 26.2h5" stroke="#1E1F22" stroke-width="1.3" stroke-linecap="round"/>

  <!-- Last item -->
  <path d="M8 31.5h6" stroke="#CED0D6" stroke-width="1.25" stroke-linecap="round"/>

