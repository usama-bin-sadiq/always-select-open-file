group = com.github.alwaysselectopenedfile
version = 1.2.0

# IntelliJ installation the plugin is compiled against.
# Point this at your own install, or override on the command line:
#   ./gradlew buildPlugin -PplatformPath=/Applications/IntelliJ\ IDEA\ CE.app
platformPath = /Applications/WebStorm.app

# Enable Gradle Configuration Cache -> https://docs.gradle.org/current/userguide/configuration_cache.html
org.gradle.configuration-cache = true

# Enable Gradle Build Cache -> https://docs.gradle.org/current/userguide/build_cache.html
org.gradle.caching = true
